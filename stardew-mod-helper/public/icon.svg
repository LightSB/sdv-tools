<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="星露谷模组下载助手图标">
  <!-- 深色底板 + 圆角外框 -->
  <rect width="512" height="512" rx="96" fill="#0f172a" />
  <rect x="32" y="32" width="448" height="448" rx="72" fill="#1e293b" />
  <rect x="32" y="32" width="448" height="448" rx="72" fill="none" stroke="#22c55e" stroke-opacity="0.35" stroke-width="4" />

  <!-- 夜空 -->
  <rect x="64" y="64" width="384" height="248" fill="#0f172a" />
  <g shape-rendering="crispEdges" fill="#94a3b8">
    <rect x="96" y="104" width="8" height="8" />
    <rect x="148" y="152" width="8" height="8" />
    <rect x="212" y="92" width="8" height="8" />
    <rect x="268" y="176" width="8" height="8" />
    <rect x="312" y="208" width="8" height="8" />
    <rect x="420" y="132" width="8" height="8" />
  </g>
  <!-- 像素弯月 -->
  <circle cx="360" cy="132" r="34" fill="#fbbf24" />
  <circle cx="376" cy="120" r="30" fill="#0f172a" />

  <!-- 像素草地 -->
  <g shape-rendering="crispEdges">
    <rect x="64" y="312" width="384" height="136" fill="#15803d" />
    <rect x="64" y="312" width="384" height="16" fill="#4ade80" />
    <rect x="64" y="328" width="384" height="12" fill="#22c55e" />
    <g fill="#166534">
      <rect x="88" y="360" width="16" height="12" />
      <rect x="176" y="392" width="12" height="12" />
      <rect x="264" y="356" width="16" height="12" />
      <rect x="344" y="404" width="12" height="12" />
      <rect x="412" y="372" width="16" height="12" />
    </g>
  </g>

  <!-- 像素镐：矿工具，呼应「挖模组」 -->
  <g transform="rotate(-38 256 236)" shape-rendering="crispEdges">
    <rect x="248" y="150" width="18" height="188" fill="#a16207" />
    <rect x="248" y="150" width="6" height="188" fill="#d97706" />
    <rect x="196" y="142" width="122" height="28" fill="#cbd5e1" />
    <rect x="188" y="134" width="20" height="44" fill="#94a3b8" />
    <rect x="306" y="134" width="20" height="44" fill="#94a3b8" />
    <rect x="246" y="138" width="22" height="36" fill="#64748b" />
  </g>

  <!-- 像素蘑菇 -->
  <g shape-rendering="crispEdges">
    <rect x="122" y="356" width="26" height="52" fill="#f1f5f9" />
    <rect x="106" y="330" width="58" height="30" fill="#f59e0b" />
    <rect x="118" y="338" width="10" height="10" fill="#fffbeb" />
    <rect x="142" y="342" width="8" height="8" fill="#fffbeb" />
  </g>

  <!-- 像素幼苗 -->
  <g shape-rendering="crispEdges">
    <rect x="382" y="364" width="8" height="44" fill="#4ade80" />
    <rect x="358" y="348" width="24" height="16" fill="#22c55e" />
    <rect x="390" y="342" width="24" height="16" fill="#4ade80" />
  </g>
</svg>
