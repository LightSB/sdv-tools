<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f7f6fb">
<title>星露谷工具箱</title>
<style>
:root{
  --bg:#f7f6fb;--bg-grad:linear-gradient(158deg,#eef1ff 0%,#f6f1fc 44%,#fdf5f3 100%);
  --surface:#fff;--ink:#1b1b28;--muted:#8b8ba3;--line:rgba(28,28,60,.07);
  --pill:#f1f0f6;--dark:#1b1b28;--dark-ink:#fff;--blue:#3d7bf5;--green:#2fae6b;--purple:#7a5af5;
  --radius:24px;--shadow:0 18px 42px -22px rgba(66,52,140,.3);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
html[data-theme=dark]{
  --bg:#131219;--bg-grad:linear-gradient(158deg,#1c1a2b 0%,#1b1724 46%,#171318 100%);
  --surface:#23222e;--ink:#f5f4fb;--muted:#9b9aae;--line:rgba(255,255,255,.1);
  --pill:#2e2d3b;--dark:#f5f4fb;--dark-ink:#1b1b28;--shadow:0 18px 42px -22px rgba(0,0,0,.7);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;max-width:100%;overflow-x:clip}
body{background:var(--bg);background-image:var(--bg-grad);background-attachment:fixed;color:var(--ink);font-family:var(--sans);min-height:100dvh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* Hero */
.hero{position:relative;overflow:hidden;max-width:560px;margin:0 auto;padding:60px 24px 26px;text-align:center}
.hero-inner{position:relative;z-index:2}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--blue);
  background:color-mix(in srgb,var(--blue) 12%,transparent);padding:7px 15px;border-radius:99px;margin-bottom:18px}
h1{font-size:clamp(28px,7.6vw,40px);line-height:1.22;margin:0;font-weight:800;letter-spacing:-.025em;
  background:linear-gradient(135deg,var(--ink) 30%,var(--blue));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

/* 波浪 */
.wave{position:absolute;pointer-events:none;opacity:.55}
.wave-a{top:-10px;left:-10%;width:120%;height:100px;transform:rotate(-6deg)}
.wave-b{bottom:-16px;right:-10%;width:120%;height:100px;transform:rotate(174deg);opacity:.35}

/* 漂浮图标 */
.float-ico{position:absolute;width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:28px;
  background:linear-gradient(150deg,#ffffff,#eef0ff);box-shadow:0 14px 30px -10px rgba(70,60,140,.32);z-index:1;
  animation:float 6s ease-in-out infinite}
html[data-theme=dark] .float-ico{background:linear-gradient(150deg,#34334a,#26253a)}
.f1{top:14%;left:6%;transform:rotate(-12deg)}
.f2{top:20%;right:7%;animation-delay:-1.5s;transform:rotate(10deg)}
.f3{bottom:10%;left:10%;animation-delay:-3s;transform:rotate(8deg)}
.f4{bottom:14%;right:8%;animation-delay:-4.5s;transform:rotate(-8deg)}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -12px}}

/* 工具卡片 */
.cards{position:relative;z-index:2;display:flex;flex-direction:column;gap:14px;width:100%;max-width:520px;margin:10px auto 0;padding:0 20px}
.card{position:relative;display:flex;align-items:center;gap:16px;text-decoration:none;color:inherit;overflow:hidden;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);
  transition:transform .22s cubic-bezier(.2,.8,.3,1),box-shadow .22s;
  animation:rise .55s cubic-bezier(.2,.8,.3,1) both}
.card:nth-child(1){animation-delay:.06s}.card:nth-child(2){animation-delay:.13s}.card:nth-child(3){animation-delay:.2s}
.card:active{transform:scale(.975)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.card::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:linear-gradient(180deg,color-mix(in srgb,var(--tone) 55%,#fff),var(--tone));opacity:.9}
.icon{width:56px;height:56px;border-radius:17px;display:grid;place-items:center;font-size:28px;color:#fff;flex:0 0 auto;
  background:linear-gradient(145deg,color-mix(in srgb,var(--tone) 68%,#fff),var(--tone));
  box-shadow:0 8px 18px -8px var(--tone)}
.card-body{flex:1;min-width:0}
.card h2{font-size:18px;margin:0;font-weight:800;letter-spacing:-.01em}
.card .sub{margin-top:3px;font-size:12px;color:var(--muted);font-weight:600}
.arrow{width:34px;height:34px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:20px;
  color:var(--muted);background:var(--pill);transition:transform .2s,background .2s,color .2s}
.card:active .arrow{transform:translateX(4px);background:var(--tone);color:#fff}

footer{position:relative;z-index:2;text-align:center;color:var(--muted);font-size:12px;line-height:1.8;
  max-width:520px;margin:28px auto 0;padding:0 24px calc(28px + env(safe-area-inset-bottom))}
footer code{font-family:ui-monospace,Menlo,monospace;background:var(--pill);padding:1px 6px;border-radius:5px}
.theme-btn{position:fixed;top:14px;right:max(16px,env(safe-area-inset-right));z-index:40;
  width:36px;height:36px;border-radius:50%;background:color-mix(in srgb,var(--surface) 85%,transparent);
  backdrop-filter:blur(12px);box-shadow:var(--shadow);font-size:16px;display:grid;place-items:center}
@media (prefers-reduced-motion:reduce){.float-ico,.card{animation:none}}
</style>
</head>
<body>
<button class="theme-btn" id="themeBtn" aria-label="切换深浅色">🌙</button>

<section class="hero">
  <svg class="wave wave-a" viewBox="0 0 400 100" preserveAspectRatio="none"><path d="M0 40 C80 10 160 70 240 40 S360 10 400 40 L400 100 L0 100Z" fill="#dcd4ff"/></svg>
  <svg class="wave wave-b" viewBox="0 0 400 100" preserveAspectRatio="none"><path d="M0 40 C80 10 160 70 240 40 S360 10 400 40 L400 100 L0 100Z" fill="#ffd9ec"/></svg>
  <div class="float-ico f1">🎣</div>
  <div class="float-ico f2">📦</div>
  <div class="float-ico f3">📜</div>
  <div class="float-ico f4">🐟</div>
  <div class="hero-inner">
    <span class="badge">🌾 手机上直接用的星露谷小工具</span>
    <h1>你的星露谷<br>随身工具箱</h1>
  </div>
</section>

<div class="cards">
  <a class="card" href="./fishing.html" style="--tone:#1e6fa8">
    <div class="icon">🎣</div>
    <div class="card-body"><h2>钓鱼一键改</h2><div class="sub">存档修改</div></div>
    <span class="arrow">›</span>
  </a>

  <a class="card" href="./xnb.html" style="--tone:#7a5af5">
    <div class="icon">📦</div>
    <div class="card-body"><h2>XNB 拆包合并</h2><div class="sub">素材拆包</div></div>
    <span class="arrow">›</span>
  </a>

  <a class="card" href="./codes.html" style="--tone:#3e8e5a">
    <div class="icon">📜</div>
    <div class="card-body"><h2>物品代码</h2><div class="sub">物品与作弊码</div></div>
    <span class="arrow">›</span>
  </a>
</div>

<footer>
  作弊码需先在存档里打开 <code>allowChatCheats</code>（钓鱼工具里点一下即可）<br>
  改存档前请先备份 · 所有处理都在你的手机本机完成
</footer>

<script>
(function(){
  let t='light';
  try{ t=localStorage.getItem('sdv-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'); }catch(e){}
  document.documentElement.dataset.theme=t;
  const b=document.getElementById('themeBtn');
  function upd(){ b.textContent=t==='dark'?'☀️':'🌙'; }
  upd();
  b.addEventListener('click',()=>{
    t=t==='dark'?'light':'dark'; document.documentElement.dataset.theme=t;
    try{ localStorage.setItem('sdv-theme',t); }catch(e){}
    upd();
  });
})();
</script>
</body>
</html>
