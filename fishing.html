<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f7f6fb">
<title>钓鱼一键改 · 星露谷存档</title>
<style>
:root{
  --bg:#f7f6fb;
  --bg-grad:linear-gradient(180deg,#f1eeff 0%,#fbf1f7 42%,#f7f6fb 100%);
  --surface:#ffffff;
  --ink:#1b1b28;
  --muted:#9292a6;
  --line:rgba(28,28,60,.08);
  --pill:#f1f0f6;
  --dark:#1b1b28;
  --dark-ink:#ffffff;
  --blue:#3d7bf5;
  --radius:22px;
  --shadow:0 10px 34px -16px rgba(66,52,140,.22);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
html[data-theme=dark]{
  --bg:#131219;
  --bg-grad:linear-gradient(180deg,#1e1b2c 0%,#1b1720 42%,#131219 100%);
  --surface:#23222e;
  --ink:#f5f4fb;
  --muted:#9b9aae;
  --line:rgba(255,255,255,.1);
  --pill:#2e2d3b;
  --dark:#f5f4fb;
  --dark-ink:#1b1b28;
  --shadow:0 10px 34px -16px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;max-width:100%}
html{overflow-x:clip}body{overflow-x:clip}
body{background:var(--bg);background-image:var(--bg-grad);background-attachment:fixed;color:var(--ink);
  font-family:var(--sans);min-height:100dvh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font-family:inherit}
.app{min-height:100dvh;display:flex;flex-direction:column}

/* 顶部胶囊导航：限宽居中，与内容区同宽 */
.nav{position:-webkit-sticky;position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;
  width:100%;max-width:560px;margin:0 auto;
  padding:10px 16px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));
  background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;white-space:nowrap;flex:0 1 auto;min-width:0}
.brand span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis}
.brand-ico{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:17px;flex:0 0 auto;
  background:linear-gradient(145deg,#5aa0ff,#3d7bf5);box-shadow:0 4px 10px -4px #3d7bf5}
.segmented{display:flex;gap:2px;padding:3px;border-radius:99px;background:var(--pill);flex:1 1 auto;min-width:0}
.segmented button{flex:1 1 0;min-width:0;padding:7px 6px;border-radius:99px;font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.segmented button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 5px rgba(0,0,0,.1)}
.theme-btn{width:34px;height:34px;border-radius:50%;background:var(--pill);font-size:15px;flex:0 0 auto;display:grid;place-items:center}
.intro-theme{position:fixed;top:14px;right:max(16px,env(safe-area-inset-right));z-index:40;
  background:color-mix(in srgb,var(--surface) 85%,transparent);backdrop-filter:blur(12px);box-shadow:var(--shadow)}

/* 开场 */
.intro{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;
  padding:70px 24px calc(70px + env(safe-area-inset-bottom));min-height:100dvh}
.intro-inner{position:relative;z-index:2;text-align:center;max-width:520px}
.intro-badge{display:inline-block;font-size:12px;font-weight:700;color:var(--blue);
  background:color-mix(in srgb,var(--blue) 12%,transparent);padding:6px 14px;border-radius:99px;margin-bottom:18px}
.intro h1{font-size:clamp(28px,7vw,44px);line-height:1.3;margin:0 0 16px;font-weight:800;letter-spacing:-.02em}
.intro p{margin:0 auto 26px;color:var(--muted);font-size:14.5px;line-height:1.7;max-width:350px}
.pill-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 30px;
  border-radius:99px;font-size:16px;font-weight:700;transition:transform .15s}
.pill-btn:active{transform:scale(.97)}
.pill-btn.dark{background:var(--dark);color:var(--dark-ink);box-shadow:0 14px 30px -12px rgba(0,0,0,.45)}
.pill-btn.dark span{opacity:.65}
.tip{margin-top:18px!important;font-size:12px!important;color:var(--muted)!important}

/* 波浪装饰 */
.wave{position:absolute;pointer-events:none;opacity:.75}
.wave-a{top:-6px;left:-10%;width:120%;height:100px;transform:rotate(-6deg)}
.wave-b{bottom:-14px;right:-10%;width:120%;height:100px;transform:rotate(174deg);opacity:.5}
.intro .wave-a{top:4%;width:130%;left:-14%;opacity:.65}
.intro .wave-b{bottom:6%;width:130%;right:-14%;opacity:.45}

/* 漂浮 app 图标 */
.float-ico{position:absolute;width:58px;height:58px;border-radius:17px;display:grid;place-items:center;font-size:30px;
  background:linear-gradient(150deg,#ffffff,#eef0ff);box-shadow:0 14px 28px -10px rgba(70,60,140,.3);z-index:1;
  animation:float 6s ease-in-out infinite}
html[data-theme=dark] .float-ico{background:linear-gradient(150deg,#34334a,#26253a)}
.fi-1{top:9%;left:8%;transform:rotate(-12deg)}
.fi-2{top:15%;right:9%;animation-delay:-1.5s;transform:rotate(10deg)}
.fi-3{bottom:13%;left:13%;animation-delay:-3s;transform:rotate(8deg)}
.fi-4{bottom:17%;right:11%;animation-delay:-4.5s;transform:rotate(-8deg)}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -12px}}

/* 主内容 */
.page{flex:1;width:100%;max-width:560px;margin:0 auto;padding:16px 16px calc(160px + env(safe-area-inset-bottom))}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px 22px 22px;background:var(--surface);box-shadow:var(--shadow);margin-bottom:16px}
.hero-top{display:flex;align-items:center;gap:10px;position:relative;z-index:2}
.hero-file{flex:1;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero-swap{font-size:12.5px;padding:6px 13px;border-radius:99px;background:var(--pill);color:var(--ink);font-weight:600}
.hero-main{display:flex;align-items:baseline;gap:8px;margin-top:18px;position:relative;z-index:2}
.hero-num{font-size:56px;line-height:1;font-weight:800;letter-spacing:-.04em;color:var(--ink)}
.hero-unit{font-size:15px;color:var(--muted);font-weight:600}
.hero-sub{margin-top:10px;font-size:13px;color:var(--muted);position:relative;z-index:2}
.chips{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;position:relative;z-index:2}
.chip{font-size:12px;padding:6px 12px;border-radius:99px;background:var(--pill);color:var(--ink);font-weight:600}

/* 卡片 */
.card{background:var(--surface);border-radius:var(--radius);padding:4px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card.plain{padding:16px}
.card.list{padding:4px 16px 0}
.section-title{margin:22px 0 10px 4px;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;min-height:54px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row label{flex:1;font-size:15px;font-weight:500}
.row input{width:132px;text-align:right;font-size:18px;font-weight:700;border:none;background:transparent;color:var(--ink);padding:8px 0;font-variant-numeric:tabular-nums}
.row input:focus{outline:none;color:var(--blue)}
.hint{margin:0 0 12px;font-size:12.5px;color:var(--muted);line-height:1.6}
.footnote{margin:10px 4px 0;text-align:center;font-size:12px;color:var(--muted);line-height:1.6}

/* 按钮 */
.cta{width:100%;min-height:50px;border-radius:99px;background:var(--dark);color:var(--dark-ink);font-size:16px;font-weight:700;box-shadow:0 12px 24px -12px rgba(0,0,0,.4)}
.cta.big{min-height:58px;font-size:18px;margin-top:6px}
.ghost{flex:1;min-height:44px;border-radius:99px;background:var(--pill);color:var(--ink);font-size:14px;font-weight:600}
.ghost:disabled{opacity:.4}

/* 条目 */
.entry{width:100%;display:flex;align-items:flex-start;gap:12px;text-align:left;padding:13px 0;border-bottom:1px solid var(--line)}
.entry:last-of-type{border-bottom:none}
.check{flex:0 0 auto;width:23px;height:23px;border-radius:50%;border:1.6px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--dark-ink);margin-top:2px}
.entry.on .check{background:var(--dark);border-color:var(--dark)}
.entry-body{display:flex;flex-direction:column;gap:6px;min-width:0}
.entry-line{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.entry-zh{font-size:15.5px;font-weight:600}
.entry-en{font-size:11.5px;color:var(--muted)}
.enchs{display:flex;flex-wrap:wrap;gap:5px}
.ench{display:inline-flex;align-items:baseline;gap:4px;font-size:11px;padding:3px 9px;border-radius:8px;background:color-mix(in srgb,var(--blue) 12%,transparent);color:var(--blue);line-height:1.35}
.ench i{font-style:normal;opacity:.6;font-size:9.5px}
.ench.muted{background:var(--pill);color:var(--muted)}

/* 背包格子 */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cell{min-height:64px;border-radius:13px;background:var(--pill);padding:8px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.cell.void{opacity:.55}
.cell.ghost{opacity:.32;background:transparent}
.cell-i{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.cell-zh{font-size:11.5px;font-weight:700;line-height:1.25;word-break:break-word}
.cell-en{font-size:8.5px;color:var(--muted);line-height:1.2;word-break:break-word}

.logline{margin:0 0 7px;font-size:13.5px;line-height:1.6}
.logline:last-child{margin-bottom:0}
.banner{margin:12px 0 0;padding:13px 15px;border-radius:14px;font-size:13px;line-height:1.5;background:color-mix(in srgb,#e05a52 13%,transparent);color:#d9463f}

/* 底部停靠栏 */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(20px);border-top:1px solid var(--line);
  display:flex;flex-direction:column;gap:9px;max-width:560px;margin:0 auto}
.dock-row{display:flex;gap:9px}
.toast{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:rgba(27,27,40,.94);color:#fff;padding:11px 20px;border-radius:99px;font-size:13.5px;z-index:50;
  white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.inl-ico{display:inline-grid;place-items:center;vertical-align:middle;width:.95em;height:.95em;font-size:.62em;
  background:var(--blue);color:#fff;border-radius:.22em;margin:0 .12em}
@media (max-width:430px){.brand span:last-child{display:none}}
@media (max-width:360px){.segmented button{font-size:11.5px;padding:7px 3px}.nav{gap:6px}}
</style>
</head>

/* 清洗 XML：兼容 iOS Safari 严格解析 + mod 注入的非法字符 */
function cleanXml(text){
  let s = String(text == null ? '' : text).replace(/^\uFEFF/, '');   // 去 BOM
  s = s.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');                // 去 XML 1.0 非法控制字符
  s = s.replace(/&(?!(?:#\d+|#x[0-9a-fA-F]+|[A-Za-z_][\w.-]*);)/g, '&amp;'); // 转义裸 &
  return s;
}
function parseXmlDoc(text){ return new DOMParser().parseFromString(cleanXml(text), 'application/xml'); }
function xmlFailMsg(text, pe){
  const raw = String(text == null ? '' : text);
  const t = raw.replace(/^\s+/, '');
  let hint = '';
  if (/^PK\x03\x04/.test(raw)) hint = '这是一个 ZIP 压缩包';
  else if (/^<\?xml|^<html/i.test(t) || /<!doctype html/i.test(t)) hint = '这是一个 HTML 网页文件';
  else if (/^[{[]/.test(t)) hint = '这是一个 JSON 文件';
  else if (!t) hint = '文件是空的';
  const head = t.slice(0, 80).replace(/[\r\n]+/g, ' ');
  let perr = '';
  try { perr = (pe && pe.textContent ? pe.textContent : '').replace(/\s+/g, ' ').slice(0, 100); } catch(e){}
  return '解析失败：读到的不是有效的 XML 存档' + (hint ? '（' + hint + '）' : '') +
    '。文件共 ' + raw.length + ' 字符，开头：' + (head || '（空）') + (perr ? ' ｜ ' + perr : '');
}
function parseSave(text){
  const doc = parseXmlDoc(text);
  const pe = doc.querySelector('parsererror');
  if (pe) throw new Error(xmlFailMsg(text, pe));
  const root = doc.documentElement;
  if (!root || root.nodeName !== 'SaveGame'){
    if (root && root.nodeName === 'SaveGameInfo') throw new Error('这是 SaveGameInfo（读档界面用的小文件），请选同目录下那个约 3 MB、没有扩展名的存档文件');
    throw new Error('解析失败：缺少 SaveGame 根节点，不是星露谷存档');
  }
  return doc;
}
function find(doc, path){
  let node = doc.documentElement;
  for (const name of path){
    if (!node) return null;
    let next = null;
    for (let c = node.firstElementChild; c; c = c.nextElementSibling){ if (c.nodeName === name){ next = c; break; } }
    node = next;
  }
  return node;
}
function readText(doc, path, fallback){
  const el = find(doc, path);
  return el ? (el.textContent || '').trim() : (fallback === undefined ? '' : fallback);
}
function listOf(parent, name){
  const out = [];
  if (!parent) return out;
  for (let c = parent.firstElementChild; c; c = c.nextElementSibling){ if (c.nodeName === name) out.push(c); }
  return out;
}
function slotsOf(doc){ return listOf(find(doc, ['player','items']), 'Item'); }
function slotTitle(el){
  const name = el && el.querySelector('name');
  return name ? (name.textContent || '?') : '空';
}
function expEl(doc){ return listOf(find(doc, ['player','experiencePoints']), 'int')[1] || null; }
function allowFlags(doc){
  const out = [];
  const root = doc.documentElement;
  for (let c = root.firstElementChild; c; c = c.nextElementSibling){
    if (/^allow/i.test(c.nodeName)){
      const v = (c.textContent || '').trim();
      if (v === 'true' || v === 'false') out.push({ name: c.nodeName, value: v === 'true' });
    }
  }
  return out;
}
function verify(text){
  try {
    const doc = parseXmlDoc(text);
    if (doc.querySelector('parsererror')) return { ok:false, reason:'导出的 XML 无法解析' };
    if (doc.documentElement.nodeName !== 'SaveGame') return { ok:false, reason:'导出内容缺少 SaveGame 根节点' };
    return { ok:true, nodes: doc.getElementsByTagName('*').length };
  } catch(e){ return { ok:false, reason:e.message }; }
}

/* ——— 文本级补丁：只动该动的字节 ——— */
function bagRange(text){
  const start = text.indexOf('<items>');
  if (start < 0) throw new Error('存档里找不到玩家背包');
  const open = start + '<items>'.length;
  const end = text.indexOf('</items>', open);
  if (end < 0) throw new Error('背包节点不完整');
  return { open, end };
}
function patchFishing(text, level, exp){
  let out = text;
  const lvl = /<fishingLevel>-?\d+<\/fishingLevel>/;
  if (!lvl.test(out)) throw new Error('找不到钓鱼等级字段');
  out = out.replace(lvl, '<fishingLevel>' + level + '</fishingLevel>');
  const block = /<experiencePoints>([\s\S]*?)<\/experiencePoints>/;
  const m = out.match(block);
  if (!m) throw new Error('找不到经验数组');
  const ints = m[1].match(/<int>-?\d+<\/int>/g) || [];
  if (ints.length < 5) throw new Error('经验数组不完整');
  ints[1] = '<int>' + exp + '</int>';
  out = out.slice(0, m.index) + '<experiencePoints>' + ints.join('') + '</experiencePoints>' + out.slice(m.index + m[0].length);
  return out;
}
function patchPrepend(text, xmlList){
  if (!xmlList.length) return text;
  const { open, end } = bagRange(text);
  const block = text.slice(open, end);
  let outBlock = xmlList.join('') + block;
  let remove = xmlList.length;
  while (remove > 0){
    const m = outBlock.match(/<Item\b[^<>]*\/>$/);
    if (!m) break;
    outBlock = outBlock.slice(0, outBlock.length - m[0].length);
    remove--;
  }
  return text.slice(0, open) + outBlock + text.slice(end);
}
function patchBagSize(text, n){
  const target = Math.max(12, Math.min(36, Math.round(Number(n) || 0)));
  const { open, end } = bagRange(text);
  const block = text.slice(open, end);
  const count = (block.match(/<Item[\s/>]/g) || []).length;
  let pad = '';
  for (let i = count; i < target; i++) pad += EMPTY_SLOT;
  let out = text.slice(0, open) + block + pad + text.slice(end);
  const mi = /<maxItems>-?\d+<\/maxItems>/;
  if (mi.test(out)) out = out.replace(mi, '<maxItems>' + target + '</maxItems>');
  return out;
}
function patchFlag(text, name, value){
  const re = new RegExp('<' + name + '>[^<]*</' + name + '>');
  if (re.test(text)) return text.replace(re, '<' + name + '>' + value + '</' + name + '>');
  const close = text.lastIndexOf('</SaveGame>');
  if (close < 0) throw new Error('存档结构异常');
  return text.slice(0, close) + '<' + name + '>' + value + '</' + name + '>' + text.slice(close);
}

const S = {
  fileName:'', raw:'', work:'', doc:null, sum:null,
  tab:'fish', level:60, exp:15000, withRod:true,
  picked:KIT.map(() => true), log:[], error:'', toast:'', undo:null,

function summarize(){
  const doc = S.doc;
  const slots = slotsOf(doc).map(slotTitle);
  return {
    player: readText(doc, ['player','name'], '?'),
    farm: readText(doc, ['player','farmName'], '?'),
    fishing: readText(doc, ['player','fishingLevel'], '0'),
    exp: expEl(doc) ? expEl(doc).textContent : '?',
    maxItems: readText(doc, ['player','maxItems'], '0'),
    slots,
    flags: allowFlags(doc),
    used: slots.filter(s => s !== '空').length,
  };
}

function loadText(text, name){
  const doc = parseSave(text);
  const clean = cleanXml(text); // 保存清洗后的干净文本，保证导出校验能过
  S.doc = doc; S.work = clean; S.raw = clean; S.fileName = name;
  S.undo = null; S.log = []; S.error = ''; S.sum = summarize();
  render();
}

function commit(nextText, lines){
  const check = verify(nextText);
  if (!check.ok){ S.error = '改动后的文件校验失败：' + check.reason; render(); return; }
  S.undo = S.work;
  S.work = nextText;
  S.doc = parseSave(nextText);
  S.sum = summarize();
  S.log = lines; S.error = '';
  render();
}

function runAll(){
  try {
    const lines = [];
    const lv = Math.round(Number(S.level) || 0);
    const ex = Math.round(Number(S.exp) || 0);
    let t = patchFishing(S.work, lv, ex);
    lines.push('✓ 钓鱼等级 ' + lv + ' 级，经验 ' + ex);
    if (S.withRod){
      const names = S.sum.slots.filter(n => n !== '空');
      if (names.includes(ROD.name)) lines.push('· 背包里已经有「' + ROD.zh + '」了，跳过');
      else {
        t = patchPrepend(t, [ROD.xml]);
        lines.push('✓ ' + ROD.zh + ' → 第 1 格');
        if (names.length) lines.push('· 原有 ' + names.length + ' 件道具顺次后移，一件没丢');
      }
    }
    commit(t, lines);
  } catch(e){ S.error = e.message; render(); }
}

function runBag(){
  try {
    const chosen = KIT.filter((_, i) => S.picked[i]);
    if (!chosen.length){ S.error = '先勾选要放入的装备'; render(); return; }
    const names = S.sum.slots.filter(n => n !== '空');
    const entries = chosen.filter(e => !(e.dedupe && names.includes(e.name)));
    const skipped = chosen.length - entries.length;
    const lines = ['✓ 背包 ' + BAG + ' 格'];
    if (skipped) lines.push('· ' + skipped + ' 件背包里已经有了，跳过');
    let t = patchBagSize(S.work, BAG);
    if (entries.length){
      t = patchPrepend(t, entries.map(e => e.xml));
      entries.forEach((e, i) => lines.push('✓ ' + e.zh + ' → 第 ' + (i + 1) + ' 格'));
      if (names.length) lines.push('· 原有 ' + names.length + ' 件道具顺次后移，一件没丢');
    }
    commit(t, lines);
  } catch(e){ S.error = e.message; render(); }
}

function toggleFlag(name, value){
  try { commit(patchFlag(S.work, name, value), ['✓ ' + name + ' → ' + value]); }
  catch(e){ S.error = e.message; render(); }
}

function undo(){
  if (!S.undo) return;
  const prev = S.undo; S.undo = null;
  S.work = prev; S.doc = parseSave(prev); S.sum = summarize();
  S.log = ['↩ 已撤销上一次修改']; S.error = '';
  render();
}

async function exportText(text, name){
  const check = verify(text);
  if (!check.ok){ S.error = '导出失败：' + check.reason; render(); return; }
  const blob = new Blob([text], { type: 'application/octet-stream' });
  try {
    const file = new File([blob], name, { type: 'application/octet-stream' });
    if (navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title:name });
      S.toast = '已交给系统分享'; render(); return;
    }
  } catch(e){ if (e && e.name === 'AbortError') return; }
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 15000);
    S.toast = '已生成文件，到「下载」里查看'; render();
  } catch(e){ S.error = '无法保存：' + e.message; render(); }
}

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function bind(){
  document.getElementById('swap').addEventListener('click',()=>document.getElementById('file').click());
  document.getElementById('exp').addEventListener('click',()=>exportText(S.work,S.fileName||'SaveGame'));
  document.getElementById('bak').addEventListener('click',()=>exportText(S.raw,(S.fileName||'SaveGame')+'_备份'));
  document.getElementById('undo').addEventListener('click',undo);
  document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{S.tab=b.dataset.tab;render();}));
  document.querySelectorAll('[data-rod]').forEach(b=>b.addEventListener('click',()=>{S.withRod=!S.withRod;render();}));
  document.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>{
    const i=Number(b.dataset.pick);S.picked=S.picked.map((v,j)=>j===i?!v:v);render();
  }));
  document.querySelectorAll('[data-flag]').forEach(b=>b.addEventListener('click',()=>{
    const name=b.dataset.flag;
    const cur=S.sum.flags.find(f=>f.name===name);
    toggleFlag(name,!(cur&&cur.value));
  }));
  const lv=document.getElementById('lv');
  if(lv)lv.addEventListener('input',e=>{S.level=e.target.value;});
  const ex=document.getElementById('ex');
  if(ex)ex.addEventListener('input',e=>{S.exp=e.target.value;});
  document.getElementById('run')?.addEventListener('click',runAll);
  document.getElementById('runbag')?.addEventListener('click',runBag);
}

/* ——— 中英对照 ——— */
const ITEM_ZH = {
  'Axe':'斧头','Hoe':'锄头','Watering Can':'水壶','Pickaxe':'镐','Scythe':'镰刀',
  'Advanced Iridium Rod':'附魔铱金鱼竿','Infinity Blade':'无限之刃','Iridium Pan':'铱金淘金盘',
  'Iridium Watering Can':'铱金水壶','Iridium Hoe':'铱金锄头','Iridium Axe':'铱金斧头',
  'Iridium Pickaxe':'铱金镐','Iridium Scythe':'铱金镰刀','Return Scepter':'回城权杖',
  Wood:'木材',Stone:'石头',Fiber:'纤维',Coal:'煤','Copper Ore':'铜矿石','Iron Ore':'铁矿石',
  'Gold Ore':'金矿石','Iridium Ore':'铱矿石','Parsnip Seeds':'防风草种子',Parsnip:'防风草','Prismatic Shard':'五彩碎片',
};
const ENCH_ZH = {
  Efficient:'高效',Master:'大师',Preserving:'防腐','Auto-Hook':'自动上钩',Vampiric:'吸血',
  'Bug Killer':'杀虫',Artful:'巧妙',Crusader:'十字军',Haymaker:'干草',Fisher:'渔夫',
  Generous:'慷慨',Reaching:'远及',Archaeologist:'考古学家',Bottomless:'无底',Swift:'迅捷',
  Shaving:'刨削',Powerful:'强力',
};
function zhOfItem(en){ return ITEM_ZH[en] || ''; }
function zhOfEnch(en){ return ENCH_ZH[en] || ''; }

/* 只认「农场名_数字」这种主存档文件名：以 _数字 结尾、无扩展名、无 _old/_SVEMERG/_SaveGameInfo 等后缀 */
const BAD_SUFFIX = /_(old|bak|backup|svemerg|savegameinfo|tmp|copy|\d+_old)$/i;
function isMainSaveName(name){
  const n = String(name || '');
  if (!/^.+_\d+$/.test(n)) return false;      // 必须以 _数字 结尾
  if (BAD_SUFFIX.test(n)) return false;        // 兜底排除已知变体后缀
  return true;
}
function saveIdOf(name){
  const m = String(name || '').match(/_(\d+)$/);
  return m ? Number(m[1]) : 0;
}

/* 从一批「带 name 的对象」里挑出主存档 —— 识别规则与原来完全一致，未作改动 */
function pickMainSave(items){
  const good = items.filter(x => isMainSaveName(x.name));
  if (!good.length) return null;
  good.sort((a, b) => saveIdOf(b.name) - saveIdOf(a.name)); // 多个取末尾数字最大的（最新存档）
  return good[0];
}

/* 一个入口同时吃「存档主文件」和「ZIP 压缩包」，两者都用同一套 pickMainSave 规则识别 */
document.getElementById('file').addEventListener('change', async e => {
  const all = Array.from(e.target.files || []);
  e.target.value = '';
  if (!all.length) return;
  try {
    const cands = [];
    for (const f of all){
      if (/\.zip$/i.test(f.name)){
        const z = zipEntries(await f.arrayBuffer());
        for (const en of z.out){
          if (/\/$/.test(en.fullName)) continue;                 // 跳过目录条目
          if (/\/__MACOSX\//.test(en.fullName)) continue;        // 跳过 mac 元数据
          const name = en.fullName.split(/[\\/]/).pop();          // 去掉包内路径，只留文件名
          cands.push({ name, fromZip:true, z, en });
        }
      } else {
        cands.push({ name: f.name, fromZip:false, file:f });
      }
    }
    const picked = pickMainSave(cands);
    if (!picked){
      const names = cands.slice(0, 5).map(x => x.name).join('、');
      S.error = '没找到主存档。请选形如「期待遇见光_776126006」的文件（农场名_数字、无扩展名），或直接选包含它的 ZIP 压缩包。' +
        '你选的是：' + (names || '（空）') + (cands.length > 5 ? ' 等' : '') +
        ' —— 带 _old / _SVEMERG / _SaveGameInfo 的都不是主存档。';
      render();
      return;
    }
    let text;
    if (picked.fromZip){
      const bytes = picked.en.method === 0
        ? untouchedBytes(picked.z, picked.en)   // 0 = 不压缩直接存储
        : await inflateRaw(untouchedBytes(picked.z, picked.en)); // 8 = deflate 压缩
      text = new TextDecoder('utf-8').decode(bytes);
    } else {
      text = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(String(r.result));
        r.onerror = () => rej(new Error('读取文件失败'));
        r.readAsText(picked.file, 'utf-8');
      });
    }
    loadText(text, picked.name + (picked.fromZip ? '（ZIP）' : ''));
    if (all.length > 1) toast('已从 ' + all.length + ' 个来源里识别出主存档：' + picked.name);
  } catch(err){
    // 读取/解析失败先清空旧的加载状态，避免错误 banner 叠在上一份存档界面上误导
    S.fileName=''; S.raw=''; S.work=''; S.doc=null; S.sum=null; S.undo=null; S.log=[];
    S.error = '读取失败：' + err.message; render();
  }
});

/* ——— ZIP 压缩包支持：解压后复用同一套 main-save 识别规则 ——— */
function zipEntries(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  const dec = new TextDecoder('utf-8');
  // 找 End Of Central Directory 记录（签名 0x06054b50），从尾部最多回看 64KB+22
  let eocd = -1;
  const min = Math.max(0, u8.length - 65557);
  for (let i = u8.length - 22; i >= min; i--){
    if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if (eocd < 0) throw new Error('压缩包格式不对：找不到目录结尾（可能不是标准 ZIP）');
  const count = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true); // 中央目录偏移
  const out = [];
  for (let i = 0; i < count; i++){
    if (dv.getUint32(off, true) !== 0x02014b50) break; // 中央目录文件头
    const method   = dv.getUint16(off + 10, true);
    const compSize = dv.getUint32(off + 20, true);
    const nameLen  = dv.getUint16(off + 28, true);
    const extraLen = dv.getUint16(off + 30, true);
    const cmtLen   = dv.getUint16(off + 32, true);
    const localOff = dv.getUint32(off + 42, true);
    const rawName  = u8.subarray(off + 46, off + 46 + nameLen);
    const fullName = dec.decode(rawName);
    out.push({ fullName, method, compSize, localOff });
    off += 46 + nameLen + extraLen + cmtLen;
  }
  return { dv, u8, out };
}
function untouchedBytes(z, e){
  const { dv, u8 } = z;
  if (dv.getUint32(e.localOff, true) !== 0x04034b50) throw new Error('压缩包里该文件头损坏');
  const nameLen = dv.getUint16(e.localOff + 26, true);
  const extraLen = dv.getUint16(e.localOff + 28, true);
  const start = e.localOff + 30 + nameLen + extraLen;
  return u8.subarray(start, start + e.compSize);
}
async function inflateRaw(bytes){
  if (typeof DecompressionStream === 'undefined')
    throw new Error('当前浏览器不支持解压 ZIP（deflate），请用最新版 Chrome / Edge / Safari 打开');
  const ds = new DecompressionStream('deflate-raw');
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

render();
